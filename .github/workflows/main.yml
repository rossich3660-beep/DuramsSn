name: Build Durams Sn VST3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target DuramsSn_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DuramsSn-VST3-Windows
          path: build/DuramsSn_artefacts/Release/VST3/
